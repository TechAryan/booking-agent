# Cloudflare Worker: free plan is enough (100k requests a day, 5 timers).
# Setup, from this folder (values come from the app's settings on Render):
#   npx wrangler login
#   npx wrangler secret put TURSO_URL       (same as the app's TURSO_DATABASE_URL, libsql://…)
#   npx wrangler secret put TURSO_TOKEN     (same as the app's TURSO_AUTH_TOKEN)
#   npx wrangler secret put APP_SECRET      (same as the app's APP_SECRET)
#   npx wrangler deploy
name = "booking-agent-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
APP_URL = "https://booking-agent-1-jv73.onrender.com"

[triggers]
crons = ["* * * * *"]

# Website photos are read straight from the photo bucket (optional; without it the app serves them).
[[r2_buckets]]
binding = "FILES"
bucket_name = "booking-agent-files"
